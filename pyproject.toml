[project]
name = "danbooru-tag-autocomplete"
version = "0.1.0"
description = "Danbooru tag autocomplete for ComfyUI, backed by continuously updated Hugging Face tag metadata"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.comfy]
PublisherId = "chynggi"
DisplayName = "Danbooru Tag Autocomplete"
web = "web"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root holds the node's __init__.py, which pytest otherwise imports as a
# package during collection; its relative imports only resolve under ComfyUI's loader.
addopts = "--confcutdir=tests"
markers = [
    "slow: exercises a full-size synthetic artifact; run with -m slow",
]
